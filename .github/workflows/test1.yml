# This is a basic workflow to help you get started with Actions

name: pierwszy_przeplyw

# Controls when the workflow will run
#on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  #push:

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      wybor_klienta:
        description: 'Wybierz klienta:'
        required: true
        default: 'Contoso'
        type: choice
        options:
          - Contoso
          - Nwtragers
          - Arcacorp
      nazwa_operatora:
        description: 'Podaj swoje imie i nazwisko'
        required: false
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  moje_pierwsze_zadanie:
    # The type of runner that the job will run on
    runs-on: debian13_runner1

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Sprawdzamy wersje python
        run: python3 -V

      - name: Wyswietl aktualny katalog roboczy
        run: pwd

      - name: Wyswietl liste plikow
        run: ls -la

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - name: Wyswietl liste plikow po checkout
        run: ls -la
      
      - name: Testujemy zmienne input
        run: |
          echo "Wybrałeś klienta: $KLIENT"
          echo "Podane imię i nazwisko: ${{ inputs.nazwa_operatora }}"
        env:
          KLIENT: ${{ inputs.wybor_klienta }}
      